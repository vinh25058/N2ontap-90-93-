<style>
/* Layout: one column of exam-paper cards under a sticky tab bar; Japanese text in a mincho face, Vietnamese UI in a clean sans. */
:root{
  --paper:#eef1f6; --card:#ffffff; --ink:#1b2234; --muted:#58627a; --line:#d6dce8;
  --accent:#2c4a9c; --accent-soft:#e3e9f8; --on-accent:#ffffff;
  --good:#1c7a4b; --good-soft:#ddf1e5; --bad:#b0281f; --bad-soft:#fbe2df;
  --jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10141d; --card:#1a202d; --ink:#e8ecf5; --muted:#9ba5bb; --line:#2c3547;
    --accent:#93abff; --accent-soft:#212a47; --on-accent:#0e1428;
    --good:#72d6a2; --good-soft:#15301f; --bad:#ff9d96; --bad-soft:#3b1d1b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141d; --card:#1a202d; --ink:#e8ecf5; --muted:#9ba5bb; --line:#2c3547;
  --accent:#93abff; --accent-soft:#212a47; --on-accent:#0e1428;
  --good:#72d6a2; --good-soft:#15301f; --bad:#ff9d96; --bad-soft:#3b1d1b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin-inline:auto}
header.top{padding-block:22px 14px}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--jp);font-weight:700;font-size:34px;line-height:1.25;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px;display:flex;gap:6px;overflow-x:auto;padding-block:8px}
.tab{font:inherit;font-family:var(--jp);font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scorebar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding-block:12px;color:var(--muted);font-size:13px}
.scorebar b{color:var(--ink);font-variant-numeric:tabular-nums}
section.panel{padding-block:10px 0}
.sec-h{margin:10px 0 2px;font-family:var(--jp);font-weight:700;font-size:20px;line-height:1.5}
.sec-h small{font-family:var(--ui);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.inst{margin:0 0 4px;font-family:var(--jp);font-size:16px;line-height:2}
.inst-vi{margin:0 0 12px;color:var(--muted);font-size:13px}
.group{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-block:12px}
.gno{font-family:var(--jp);font-weight:700;font-size:18px;margin-bottom:8px}
ruby{ruby-position:over}
rt{font-size:.52em;letter-spacing:0;font-family:var(--jp);font-weight:500}
.jp{font-family:var(--jp);line-height:2.15}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.res{margin-top:10px;font-size:14px;font-weight:600;min-height:1.4em}
.res.good{color:var(--good)} .res.bad{color:var(--bad)}
/* 連語 */
.lk-row{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.lk-row:first-of-type{border-top:0}
.lk-l{font-family:var(--jp);font-size:17px;line-height:2.2;min-width:0}
.lk-line{display:flex;gap:8px;align-items:center;min-width:0}
.lk-arrow{color:var(--muted)}
.lk-slot{font:inherit;font-family:var(--jp);font-size:17px;min-width:9em;max-width:100%;text-align:left;padding:6px 12px;border:1.5px dashed var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;min-height:44px}
.lk-slot .ph{font-family:var(--ui);font-size:13px;color:var(--muted)}
.lk-row.active .lk-slot{border-color:var(--accent);background:var(--accent-soft)}
.lk-slot.filled{border-style:solid;border-color:var(--line);background:var(--card)}
.lk-row.ok .lk-slot{border:1.5px solid var(--good);background:var(--good-soft)}
.lk-row.no .lk-slot{border:1.5px solid var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.pool-l{width:100%;font-size:12px;color:var(--muted)}
.chip{font:inherit;font-family:var(--jp);font-size:17px;padding:6px 12px;min-height:44px;border:1px solid var(--accent);color:var(--accent);background:var(--card);border-radius:8px;cursor:pointer}
.chip.used{opacity:.45}
/* 意味 */
.words{font-family:var(--jp);font-size:17px;line-height:2.2;background:var(--accent-soft);border-radius:8px;padding:6px 12px;margin-bottom:10px}
.im-item{padding:8px 0;border-top:1px solid var(--line)}
.im-item:first-of-type{border-top:0}
.im-s{font-family:var(--jp);font-size:17px;line-height:2.4}
.im-s .lab{font-family:var(--ui);font-size:12px;font-weight:700;color:var(--muted);margin-right:6px}
.blank{font-family:var(--jp);font-size:17px;width:7em;max-width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;color:var(--ink);padding:2px 4px;text-align:center;border-radius:0}
.blank.ok{border-bottom-color:var(--good);background:var(--good-soft)}
.blank.no{border-bottom-color:var(--bad);background:var(--bad-soft)}
.blank.shown{border-bottom-color:var(--accent);background:var(--accent-soft)}
.ans{font-family:var(--jp);font-size:15px;color:var(--good);font-weight:700}
.ex-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.exp{margin-top:4px;font-size:14px}
.exp summary{cursor:pointer;color:var(--accent);font-weight:600;padding:2px 0}
.exp .b{padding:8px 12px;margin-top:4px;background:var(--accent-soft);border-radius:8px;line-height:1.7}
.exp .b p{margin:0 0 6px}
.exp .b p:last-child{margin:0}
.exp .vi{font-style:italic}
/* Ⅲ quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-block:12px}
.q-h{display:flex;gap:10px;align-items:flex-start}
.q-n{flex:none;font-family:var(--jp);font-weight:700;border:1.5px solid var(--ink);border-radius:4px;min-width:30px;height:30px;display:grid;place-items:center;font-size:15px;margin-top:6px}
.q-s{font-family:var(--jp);font-size:18px;line-height:2.3;min-width:0}
.gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;font-weight:700;color:var(--accent);margin-inline:2px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.opts.long{grid-template-columns:minmax(0,1fr)}
.opt{font:inherit;font-family:var(--jp);font-size:17px;line-height:1.9;text-align:left;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;display:flex;gap:10px;min-width:0}
.opt .on{font-family:var(--ui);font-weight:700;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.opt .ot{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.verdict{margin-top:8px;font-size:14px;font-weight:700}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
[hidden]{display:none!important}
@media (max-width:480px){
  h1{font-size:28px}
  .opts{grid-template-columns:minmax(0,1fr)}
  .opt{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function rb(s){ return s.replace(/([一-鿿々〆]+)\{([^}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>"); }
function jpMark(s){ return rb(s).replace("[[]]", '<span class="gap">&nbsp;</span>'); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

var TABS = [{ id: "lk", t: "連語" }, { id: "im", t: "意味" }, { id: "q1", t: "Ⅲ-1" }, { id: "q2", t: "Ⅲ-2" }, { id: "q3", t: "Ⅲ-3" }];
var tabsEl = document.getElementById("tabs");
var panelsEl = document.getElementById("panels");

TABS.forEach(function(t, i){
  var b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.setAttribute("role", "tab"); b.id = "tab-" + t.id;
  b.setAttribute("aria-selected", i === 0 ? "true" : "false"); b.textContent = t.t;
  b.addEventListener("click", function(){ showTab(t.id); });
  tabsEl.appendChild(b);
  var p = document.createElement("section");
  p.className = "panel"; p.id = "panel-" + t.id; p.setAttribute("role", "tabpanel");
  p.hidden = i !== 0;
  panelsEl.appendChild(p);
});
function showTab(id){
  TABS.forEach(function(t){
    document.getElementById("panel-" + t.id).hidden = t.id !== id;
    document.getElementById("tab-" + t.id).setAttribute("aria-selected", t.id === id ? "true" : "false");
  });
  try { window.scrollTo(0, 0); } catch (e) {}
}

/* ---------- 連語 ---------- */
var lks = LK.map(function(g){ return { assign: g.rows.map(function(){ return null; }), active: 0, checked: false, show: false, res: "" }; });

function lkRender(gi){
  var g = LK[gi], s = lks[gi], h = "";
  h += '<div class="gno">' + g.no + "</div>";
  g.rows.forEach(function(r, ri){
    var ai = s.assign[ri], cls = "lk-row";
    if (s.active === ri && !s.checked) cls += " active";
    if (s.checked) cls += (ai === r.a) ? " ok" : " no";
    h += '<div class="' + cls + '" data-row="' + ri + '">';
    h += '<div class="lk-l" data-act="' + ri + '">' + rb(r.l) + "</div>";
    h += '<div class="lk-line"><span class="lk-arrow">→</span>';
    h += '<button type="button" class="lk-slot' + (ai !== null ? " filled" : "") + '" data-slot="' + ri + '">' +
         (ai === null ? '<span class="ph">chạm để chọn</span>' : rb(g.right[ai])) + "</button></div>";
    if (s.show) {
      h += '<details class="exp" open><summary>Giải thích</summary><div class="b"><p><b>' + rb(g.right[r.a]) + "</b></p><p>" + esc(r.n) + "</p></div></details>";
    }
    h += "</div>";
  });
  h += '<div class="pool"><div class="pool-l">Chọn một ô bên trên rồi chạm vào cụm từ để nối:</div>';
  var used = {}; s.assign.forEach(function(a){ if (a !== null) used[a] = true; });
  g.right.forEach(function(t, i){
    h += '<button type="button" class="chip' + (used[i] ? " used" : "") + '" data-chip="' + i + '">' + rb(t) + "</button>";
  });
  h += "</div>";
  h += '<div class="btns"><button type="button" class="btn" data-lk="check">Kiểm tra</button>' +
       '<button type="button" class="btn ghost" data-lk="show">Xem đáp án</button>' +
       '<button type="button" class="btn ghost" data-lk="reset">Làm lại</button></div>';
  h += '<div class="res ' + (s.resCls || "") + '">' + esc(s.res) + "</div>";
  document.getElementById("lkg" + gi).innerHTML = h;
}
function lkNextEmpty(s, from){
  var n = s.assign.length;
  for (var k = 1; k <= n; k++) { var i = (from + k) % n; if (s.assign[i] === null) return i; }
  return from;
}
function lkInit(){
  var p = document.getElementById("panel-lk");
  var h = '<h2 class="sec-h">Ⅱ．基本練習<small>Bài tập cơ bản</small></h2>';
  h += '<h3 class="sec-h" style="font-size:18px">1 連語<small>Cụm từ đi cùng nhau</small></h3>';
  h += '<p class="inst">一緒に使う言葉を覚えよう。</p>';
  h += '<p class="inst">例のように一緒に使う言葉を線で結びなさい。</p>';
  h += '<p class="inst-vi">Nối các từ đi cùng nhau. Ở mỗi nhóm, chọn một hàng bên trái rồi chạm vào cụm động từ bên dưới để ghép.</p>';
  LK.forEach(function(g, gi){ h += '<div class="group" id="lkg' + gi + '" data-g="' + gi + '"></div>'; });
  p.innerHTML = h;
  LK.forEach(function(g, gi){ lkRender(gi); });
  p.addEventListener("click", function(e){
    var grp = e.target.closest(".group"); if (!grp) return;
    var gi = +grp.getAttribute("data-g"), s = lks[gi], g = LK[gi];
    var t;
    if ((t = e.target.closest("[data-act]"))) { s.active = +t.getAttribute("data-act"); lkRender(gi); return; }
    if ((t = e.target.closest("[data-slot]"))) {
      var ri = +t.getAttribute("data-slot");
      if (s.assign[ri] !== null && s.active === ri) { s.assign[ri] = null; s.checked = false; s.res = ""; }
      s.active = ri; lkRender(gi); return;
    }
    if ((t = e.target.closest("[data-chip]"))) {
      var ci = +t.getAttribute("data-chip");
      s.assign = s.assign.map(function(a){ return a === ci ? null : a; });
      s.assign[s.active] = ci; s.checked = false; s.res = ""; s.resCls = "";
      s.active = lkNextEmpty(s, s.active); lkRender(gi); return;
    }
    if ((t = e.target.closest("[data-lk]"))) {
      var act = t.getAttribute("data-lk");
      if (act === "check") {
        var ok = 0; g.rows.forEach(function(r, i){ if (s.assign[i] === r.a) ok++; });
        s.checked = true; s.show = true; s.res = ok + " / " + g.rows.length + " hàng đúng";
        s.resCls = ok === g.rows.length ? "good" : "bad";
      } else if (act === "show") {
        s.assign = g.rows.map(function(r){ return r.a; }); s.checked = true; s.show = true;
        s.res = "Đây là đáp án đúng"; s.resCls = "good";
      } else {
        s.assign = g.rows.map(function(){ return null; }); s.active = 0; s.checked = false; s.show = false; s.res = ""; s.resCls = "";
      }
      lkRender(gi);
    }
  });
}

    g.ex.forEach(function(x, i){

           '<details class="exp"><summary>Giải thích</summary><div class="b"><p class="vi">' + esc(x.vi) + "</p><p>" + esc(x.n) + "</p></div></details></div>";
    });
  }
  g.items.forEach(function(it, i){
    var circ = "①②③④"[+it.id.charAt(0) - 1], ab = it.id.charAt(1);
    var inp = '<input type="text" class="blank" id="im-' + gi + "-" + it.id + '" data-g="' + gi + '" data-i="' + i + '" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ja" aria-label="Đáp án câu ' + circ + ab + '">';

         '<div class="imx" id="imx-' + gi + "-" + i + '"></div></div>';
  });
  h += '<div class="btns"><button type="button" class="btn" data-im="check">Kiểm tra</button>' +
       '<button type="button" class="btn ghost" data-im="show">Xem đáp án</button>' +
       '<button type="button" class="btn ghost" data-im="reset">Làm lại</button></div>';
  h += '<div class="res" id="imr-' + gi + '"></div>';

}
function norm(s){ return String(s).replace(/[\s　()（）]/g, ""); }

  IM.forEach(function(g, gi){ h += '<div class="group" id="img' + gi + '">' + imGroupHTML(g, gi) + "</div>"; });

    var ok = 0;
    g.items.forEach(function(it, i){

      var box = document.getElementById("imx-" + gi + "-" + i);
      inp.classList.remove("ok", "no", "shown");

    });

    if (act === "check") { r.textContent = ok + " / " + g.items.length + " câu đúng"; r.className = "res " + (ok === g.items.length ? "good" : "bad"); }

    h += '<div class="opts' + (longOpts ? " long" : "") + '">';
    it.o.forEach(function(o, oi){
      var n = oi + 1, cls = "opt";
      if (s.graded) { if (n === it.a) cls += " ok"; else if (s.sel[i] === n) cls += " no"; }
      else if (s.sel[i] === n) cls += " sel";
      h += '<button type="button" class="' + cls + '" data-q="' + i + '" data-o="' + n + '"' + (s.graded ? " disabled" : "") + '><span class="on">' + n + '</span><span class="ot">' + rb(o) + "</span></button>";
    });
    h += "</div>";
    if (s.graded) {
      var right = s.sel[i] === it.a;
      h += '<div class="verdict ' + (right ? "good" : "bad") + '">' + (right ? "✓ Đúng" : (s.sel[i] ? "✗ Sai. Đáp án đúng: " + it.a : "Chưa chọn. Đáp án đúng: " + it.a)) + "</div>";
      h += '<details class="exp"><summary>Giải thích</summary><div class="b"><p class="vi">' + esc(it.vi) + "</p>";
      it.e.forEach(function(x, xi){ h += "<p><b>" + (xi + 1) + ".</b> " + esc(x) + "</p>"; });
      h += "</div></details>";
    }
    h += "</div>";
  });
  var c = qScore(qi), tot = q.items.length;
  h += '<div class="btns">' + (s.graded ? "" : '<button type="button" class="btn" data-qa="grade">Chấm điểm</button>') +
       '<button type="button" class="btn ghost" data-qa="reset">Làm lại</button></div>';
  if (s.graded) h += '<div class="res ' + (c === tot ? "good" : "bad") + '">' + c + " / " + tot + " câu đúng · " + (c * q.pts) + " / " + (tot * q.pts) + " điểm</div>";
  return h;
}
function qRender(qi){
  var q = QZ[qi], p = document.getElementById("panel-" + q.id);
  p.querySelector(".qbody").innerHTML = qHTML(qi);
  updateScore();
}
function qInit(){
  QZ.forEach(function(q, qi){
    var p = document.getElementById("panel-" + q.id);
    var h = "";
    if (qi === 0) h += '<h2 class="sec-h">Ⅲ．実践練習<small>Luyện tập thực hành</small></h2>';
    h += '<h3 class="sec-h" style="font-size:18px">' + esc(q.title) + "<small>" + esc(q.unit) + "</small></h3>";
    h += '<div class="qbody"></div>';
    p.innerHTML = h;
    p.addEventListener("click", function(e){
      var t;
      if ((t = e.target.closest("[data-o]"))) {
        if (qs[qi].graded) return;
        qs[qi].sel[+t.getAttribute("data-q")] = +t.getAttribute("data-o"); qRender(qi); return;
      }
      if ((t = e.target.closest("[data-qa]"))) {
        if (t.getAttribute("data-qa") === "grade") qs[qi].graded = true;
        else { qs[qi].graded = false; qs[qi].sel = q.items.map(function(){ return 0; }); }
        qRender(qi);
      }
    });
    qRender(qi);
  });
}
function updateScore(){
  var tot = 0, max = 0, parts = [];
  QZ.forEach(function(q, qi){
    var m = q.items.length * q.pts; max += m;
    if (qs[qi].graded) { var sc = qScore(qi) * q.pts; tot += sc; parts.push(q.tab + ": <b>" + sc + "/" + m + "</b>"); }
    else parts.push(q.tab + ": <b>–/" + m + "</b>");
  });
  scoreEl.innerHTML = "Điểm phần Ⅲ · " + parts.join(" · ") + " · Tổng: <b>" + tot + "/" + max + "</b>";
}

lkInit(); imInit(); qInit();
try { var hh = (location.hash || "").replace("#", ""); if (TABS.some(function(t){ return t.id === hh; })) showTab(hh); } catch (e) {}
</script>
